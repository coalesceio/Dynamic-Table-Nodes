fileVersion: 2
id: "183"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: SQL Dynamic Table Work
    short: DT_WRK
    tagColor: "#F6FF3C"
    plural: Dynamic Tables

    deployStrategy: advanced

    annotations:
      node:

      - name: materializationType
        description: Materialization selector
        isRequired: false
        parameters:
          - name: type
            type: string
            description: Object type to create
            isRequired: true
            default: dynamic table
            options:
            - dynamic table

      - name: clusterEnabled
        type: boolean
        description: Determines whether clustering is applied to the table.
        isRequired: false      
        default: true

      - name: selectDistinct
        type: boolean
        description: Rows are processed using DISTINCT.
        isRequired: false
        default: true

      - name: warehouse
        description: Warehouse on which to execute dynamic table. Ensure the parameter targetDynamicTableWarehouse is added in Workspace. Appplicable only when 𝗮𝗱𝘃𝗮𝗻𝗰𝗲𝗪𝗮𝗿𝗲𝗵𝗼𝘂𝘀𝗲 is disabled.
        parameters:
        - name: warehouseName
          type: string
          description: warehouse name
          isRequired: true
          example: 'dev_wh_xs'

      - name: advanceWarehouse
        type: string
        description: Advanced Warehouse Selection
        isRequired: false      
        default: true
        parameters:
        - name: initializeWarehouseSize
          type: string
          description: Initialization Warehouse Size.
          isRequired: false
          default: X-Small
          options:   
            - X-Small
            - Small
            - Medium
            - Large
            - X-Large
            - 2X-Large
            - 3x-Large
            - 4x-Large
            - 5x-Large
            - 6x-Large

        - name: refreshWarehouseSize
          type: string
          description: Refresh Warehouse Size.
          isRequired: false
          default: X-Small
          options:  
            - X-Small
            - Small
            - Medium
            - Large
            - X-Large
            - 2X-Large
            - 3x-Large
            - 4x-Large
            - 5x-Large
            - 6x-Large

      - name: targetLagDownstream
        type: boolean
        description: Downstream
        isRequired: false      
        default: true

      - name: targetLagDuration
        description: Lag Specification. Available only when 𝗧𝗮𝗿𝗴𝗲𝘁𝗟𝗮𝗴𝗗𝗼𝘄𝗻𝘀𝘁𝗿𝗲𝗮𝗺 is disabled.
        parameters:
          - name: lagNum
            type: number
            description: Time unit
            isRequired: true
            example: 60

          - name: lagPeriod
            type: string
            description: Time period
            isRequired: false
            default: Minutes
            options:
              - Seconds
              - Minutes
              - Hours
              - Days
      
      - name: refreshMode
        type: string
        description: Refresh Mode
        isRequired: false
        default: AUTO
        parameters:
          options:
            - AUTO
            - INCREMENTAL
            - FULL

      - name: initialize
        type: string
        description: initialize
        isRequired: false
        default: ON_CREATE
        options:
          - ON_CREATE
          - ON_SCHEDULE

      - name: cpygrants
        type: boolean
        description: Copy grants
        isRequired: false      
        default: true

      - name: immutabilityConstraint
        type: boolean
        description: Immutability Constraint
        isRequired: false      
        default: true

      - name: immutableExpression
        description: Immutable Where Expression(Eg- column_name < CURRENT_TIMESTAMP() - INTERVAL '7 days'). Available only when immutabilityConstraint is enabled.
        parameters:
        - name: expression
          type: string
          description: warehouse name
          isRequired: true

      - name: backfill
        type: boolean
        description: Enable Backfill. Available only when immutabilityConstraint is enabled.
        isRequired: false
        default: true

      - name: backfillSourceSchema
        description: Backfill Source Schema. Available only when immutabilityConstraint and backfill are enabled.
        parameters:
          - name: schema
            type: string
            description: warehouse name
            isRequired: true

          - name: table
            type: string
            description: Backfill Source Table.
            isRequired: true

      - name: timeTravel
        type: boolean
        description: Use Time Travel. Available only when immutabilityConstraint and backfill are enabled.
        isRequired: false
        default: true

      - name: timeTraveltype
        type: string
        description: Time Travel Type. Available only when immutabilityConstraint and backfill are enabled.
        isRequired: false
        default: AT
        options:
          - AT
          - BEFORE

      - name: timeTravelreference
        type: string
        description: Time Travel Reference. Available only when immutabilityConstraint and backfill are enabled.
        isRequired: false
        default: AT
        options:
          - OFFSET
          - STATEMENT

      column:
      - name: isClusterKey
        description: Determines whether column is part of table cluster. Applicable only when @𝐜𝐥𝐮𝐬𝐭𝐞𝐫𝐄𝐧𝐚𝐛𝐥𝐞𝐝 is applied. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
        allowsMultiple: true
        parameters:
          - name: clusterOrder
            isRequired: true
            type: number
            description: Order of the cluster used while clustering.
            example: 1

          - name: clusterExpression
            isRequired: false
            type: string
            description: Expression used while clustering. If the expression is omitted, the 𝐂𝐨𝐥𝐮𝐦𝐧 𝐍𝐚𝐦𝐞 is used as the clustering expression by default.
            example: trunc(columnName, -5)
name: SQL Dynamic Table Work
type: NodeType
